slug: flash_attention_backward
version: 1
category: attention
difficulty: 5
probes: >
  Whether the model can derive the attention backward pass rather than recall
  it, and in particular whether it recognises that the row correction
  rowsum(dO * O) is a property of the whole query row and cannot be accumulated
  from the key block in hand, which is the one term a blocked implementation
  gets wrong while still returning gradients of the right shape and scale.
time_limit_s: 180
tier: laptop
requires_gpu: false
deps: [torch]
hidden_tests: 49
added: 2026-08-09
# In v2 as of 2026-08-17, and it is the task the admission rule changed for. The
# rule used to read the single best calibration entry, so claude-opus-5 at 15/15
# refused this task outright. claude-sonnet-5 loses two draws of ten to the same
# pair of tests both times, which makes this the only task on the laptop tier
# that separates one frontier model from another. The rule now reads the top two
# measured entries and refuses a task only when both are at the ceiling; this is
# the one task in the repository whose set that change moves, and the argument
# for it was written in docs/sessions/10 before the rule was touched.
# docs/LESSONS.md L35.
#
# The draws are unchanged and published under leaderboard/, where
# tools/check_calibration.py re-derives every line below from them. Twenty draws
# were asked of Haiku and one came back `adapter_error`, so it is in neither the
# numerator nor the denominator: an absence of evidence is not a failure.
# Left v2 for warmup on 2026-09-17, refused by the same rule that admitted it,
# on ten fresh draws per model and a second vendor. claude-sonnet-5 went 10 for
# 10 and gpt-5.6-sol and gpt-5.6-terra went 10 for 10 each, so the top two
# measured entries are both at the ceiling and _check_admission refuses it. The
# two Sonnet losses that made this the one laptop task separating two frontier
# Claudes did not repeat.
#
# It stays useful and stays published: claude-haiku-4-5 is 5 of 29, which is
# what warmup is for. What it no longer does is measure the frontier, and v2
# consequently ships with no laptop member at all rather than with a member
# nobody fails. The alternative was to keep the OpenAI draws out of the block
# above, which would have held the task in the set by choosing which evidence
# counts after seeing which way it went (docs/LESSONS.md L21, L35, L43).
# docs/ROADMAP.md section 11.
frozen_set: warmup
calibration:
  - model: claude-opus-5
    draws: 25
    passed: 25
    date: 2026-09-17
  - model: claude-sonnet-5
    draws: 20
    passed: 18
    date: 2026-09-17
  - model: claude-haiku-4-5
    draws: 29
    passed: 5
    date: 2026-09-17
  - model: gpt-5.6-sol
    draws: 10
    passed: 10
    date: 2026-09-17
  - model: gpt-5.6-terra
    draws: 10
    passed: 10
    date: 2026-09-17
  - model: gpt-5.6-luna
    draws: 10
    passed: 9
    date: 2026-09-17
