slug: chunked_batchnorm_reduction
version: 1
category: training
difficulty: 5
probes: >
  Whether the model sees that a single reduction over the batch forces raw
  moments rather than centred ones — that sum(dy * xhat) is an affine
  combination of two sums available before the mean exists, so the two-pass
  shape the backward pass suggests can be collapsed into one — and whether it
  then designs the buffer that carries it.
time_limit_s: 180
tier: laptop
requires_gpu: false
deps: [torch]
added: 2026-09-06
# Laptop candidate 3, written against ROADMAP.md 9.3: both halves of the laptop
# criterion rather than the first one only. Candidate 2,
# chunked_batchnorm_backward, is the same layer and the same decomposition, and
# it is warmup because the whole-batch state its graded unit was missing arrived
# in that unit's own signature (docs/LESSONS.md L44). Here nothing does. The
# mean, the variance, the count and both parameter gradients are absent from
# every signature; the caller performs exactly one reduction whose contents the
# solution designs, and the quantity that has to be recovered is
# sum(dy * xhat) = (sum(dy * x) - mean * sum(dy)) / sqrt(var + eps), which needs
# a mean that does not exist yet when the reduction runs.
#
# The prompt claims nothing about the driver. Like flash_attention_backward's,
# it holds every chunk and could reduce twice; what is enforced is the shape of
# the two graded functions, and the hidden tests drive the protocol themselves
# rather than trusting it.
frozen_set: warmup
#
# The sweep was cut off on 2026-09-06 by the Anthropic credit balance running
# out, and finished on 2026-09-08: nine more Sonnet draws and ten Haiku draws.
# The nine `adapter_error`s of the first attempt measured nothing and are in
# neither the numerator nor the denominator, so they are not counted below.
#
# `warmup`, and the admission rule is not what put it there. The rule reads the
# top two measured entries and refuses only a task both of them clear; Sonnet
# 10/10 and Opus 9/10 do not both clear it, so `v2` would have been accepted.
# The reason is the shape of the losses rather than their count (docs/LESSONS.md
# L27, and L45, which is this task). `chunk_sizes0` is the single-chunk split
# `(6,)`, where the mistake this task is named after is correct by construction.
# Eleven draws were lost across the thirty and ten of them fail `chunk_sizes0`
# too, Opus's one loss included: it leaves `count` at shape `(channels,)` and
# divides it into a three-dimensional tensor, which is a broadcasting slip and
# not a reduction it failed to design. Exactly one loss in thirty is the
# chunked mistake — Haiku's tenth draw, which builds a correct four-row buffer,
# omits sum(x*x) from it, and so computes the variance over one chunk while
# dividing by the whole batch's count. The frontier is 20/20 on the mechanism.
#
# Admitting it to `v2` on the strength of Opus's slip would publish a number
# about a reduction under a task whose reduction nothing at the top of the field
# got wrong, which is L21 in a new costume. It is a real, calibrated task that
# separates Haiku cleanly and it ships as one; it is not evidence about the
# laptop tier. See ROADMAP.md 9.4.
calibration:
  - model: claude-opus-5
    draws: 10
    passed: 9
    date: 2026-09-06
  - model: claude-sonnet-5
    draws: 10
    passed: 10
    date: 2026-09-08
  - model: claude-haiku-4-5
    draws: 10
    passed: 0
    date: 2026-09-08
