slug: attention_causal_mask
version: 1
category: attention
difficulty: 2
probes: >
  Whether the model gets the masking direction and the -inf convention right,
  anchors a short query chunk at the end of the key range the way a KV-cache
  requires, composes padding with causality, and survives the fully masked row
  that combination produces instead of returning NaN.
time_limit_s: 90
requires_gpu: false
deps: [numpy]
added: 2026-07-26
# Moved out of v1 on 2026-08-13, on draws that were already published rather
# than on new ones: the five-draw v1 sweeps of 2026-08-09 and the single sweep of
# 2026-08-03, all checked in under leaderboard/. The entries below are dated by
# the sweep they mostly come from; the sixth draw of each six is the earlier one.
# The admission rule in TASK_FORMAT.md refuses a task from a numbered set when
# the best model tried never fails it, and the task is unchanged and still
# published — it is out of the headline, not out of the repository.
frozen_set: warmup
calibration:
  - model: claude-opus-5
    draws: 6
    passed: 6
    date: 2026-08-09
  - model: claude-sonnet-5
    draws: 5
    passed: 5
    date: 2026-08-09
  - model: claude-haiku-4-5
    draws: 6
    passed: 4
    date: 2026-08-09
