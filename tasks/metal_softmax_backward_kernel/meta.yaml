slug: metal_softmax_backward_kernel
version: 1
category: kernels
difficulty: 4
probes: >
  Whether the model can hold three threadgroup reductions and their barriers in
  one Metal kernel: the row maximum, the softmax denominator under that shift,
  and the contraction of the upstream gradient against a softmax that is never
  materialised — then rebuild the softmax from the same shift and write the row
  back, with a group size the kernel does not choose and does not divide the row.
time_limit_s: 300
tier: accelerated
requires_gpu: true
accelerator: metal
deps: [torch]
added: 2026-08-30
# Written and verified on an M1 Pro on 2026-08-30. The reference passes 81
# hidden tests and the untouched starter fails all 81 with assertion errors.
# Nineteen mutants, sixteen caught and three expected to survive, every one
# carrying the verdict it was written to get; tools/mutate_metal_task.py re-runs
# the pass. Two of those expectations were wrong when first written and both
# were findings rather than bookkeeping: docs/LESSONS.md L38 and L39.
#
# The tolerance in the hidden tests is a measurement, not a guess. Over every
# configuration the file ships, the reference's worst absolute deviation from a
# float64 CPU autograd gradient is 9.9e-8 and its worst absolute row sum is
# 2.0e-7, against an ATOL of 2e-6.
#
# This task shipped uncalibrated on 2026-08-30 and said here that it had an
# instability the forward Metal task did not. That was wrong, and the correction
# is worth more than the original claim: the stall belongs to the machine, not to
# this task. On this M1 Pro every other process that touches torch.mps is blocked
# for the whole of its life, whatever it is running — no custom shader and no
# failing test required, and metal_cross_entropy_kernel is equally exposed.
# docs/LESSONS.md L42 has the measurements and the reasoning error that hid it.
#
# runner/mps_stall.py now refuses to grade in such a process and relaunches, and
# a run that never finds a healthy one is `mps_stalled` — no evidence — rather
# than a `timeout` that would look like the solution's fault. The thirty draws
# below were taken under that guard: sixty gradings, and not one `timeout`, one
# `mps_stalled` or one `collection_error` among them.
#
# Calibrated on 2026-09-04, ten draws per model, and it earns a numbered set on
# the rule in README: the highest two rates are 80% and 60%, so the frontier does
# not clear it. Opus loses two draws of ten and Sonnet four, every one of them to
# a Metal compile error rather than to a wrong answer — the failure shape this
# task turns out to measure is that the three reductions are easy to write and
# the type and address-space rules around the shared scratch array are not.
# tools/check_calibration.py re-derives every line below from calibration/.
frozen_set: v2
