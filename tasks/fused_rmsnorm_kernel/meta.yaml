slug: fused_rmsnorm_kernel
version: 1
category: kernels
difficulty: 4
probes: >
  Whether the model can write a real Triton reduction: float32 accumulation
  under a float16 input, a row walked in blocks with the tail masked, and two
  independent row strides, rather than a PyTorch one-liner in a wrapper.
time_limit_s: 300
tier: accelerated
requires_gpu: true
accelerator: cuda
deps: [torch, triton]
hidden_tests: 24
added: 2026-07-28
# In, as of 2026-08-02: the reference passes 24 tests on an RTX A4500, the
# untouched starter fails all 24 with real test failures, and all six mutants
# are caught. The transcript is in docs/sessions/06 and the mutation script is
# in tools/, so the claim is re-runnable rather than remembered.
#
# Moved from v1 to v2 on 2026-08-17 on the five-draw 2026-08-09 sweep (RTX 4000
# Ada), where it was the lowest frontier rate in the repository: Opus 1/5, Haiku
# 3/5, and claude-sonnet-5 never asked because asking it needed a rented box.
#
# Moved from v2 to warmup on 2026-10-28, by the admission rule and not by hand.
# The CUDA member was finished at ten draws per model across both vendors on a
# rented RTX 4090: Opus 5/10 (all five losses the single-column edge,
# test_a_single_column, the same signature as August), Haiku 5/10 (the wrapper
# contract, not the kernel), and claude-sonnet-5 10/10, gpt-5.6-sol 10/10,
# gpt-5.6-terra 10/10, gpt-5.6-luna 10/10. The top two measured rates are both
# 100%, so _check_admission refuses it. This is flash_attention_backward's story
# a second time: more draws and a second vendor saturated the top and the
# mechanical rule ejected the task (docs/LESSONS.md L55). The Opus figure is
# cumulative over August's five draws and October's ten; the task version did
# not change and a Triton kernel's correctness does not depend on which CUDA card
# graded it, so the two sweeps are the same measurement.
frozen_set: warmup
