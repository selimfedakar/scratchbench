slug: fused_rmsnorm_kernel
version: 1
category: kernels
difficulty: 4
probes: >
  Whether the model can write a real Triton reduction: float32 accumulation
  under a float16 input, a row walked in blocks with the tail masked, and two
  independent row strides, rather than a PyTorch one-liner in a wrapper.
time_limit_s: 300
tier: accelerated
requires_gpu: true
accelerator: cuda
deps: [torch, triton]
added: 2026-07-28
# In, as of 2026-08-02: the reference passes 24 tests on an RTX A4500, the
# untouched starter fails all 24 with real test failures, and all six mutants
# are caught. The transcript is in docs/sessions/06 and the mutation script is
# in tools/, so the claim is re-runnable rather than remembered.
#
# Moved from v1 to v2 on 2026-08-17, on draws that were already published rather
# than on new ones: the five-draw sweep of 2026-08-09 on an RTX 4000 Ada, checked
# in under leaderboard/ and re-derived by tools/check_calibration.py. This is the
# task with the lowest frontier pass rate in the repository, and the only one
# where the smaller model scores higher than the larger; five draws cannot
# distinguish 20% from 60%, and the rates are not the reason it is here. The
# failure shapes are: four of Opus's five draws fail one test, test_a_single_
# column, every time, and Haiku's failures are 24 of 24 and 23 of 24. See
# docs/LESSONS.md L27 and the leaderboard page.
#
# claude-sonnet-5 has never been asked this task, because asking it needs a
# rented CUDA box. The admission rule reads the top two entries and both are
# here, so the task qualifies on what exists; a third model would be better
# evidence and is not a precondition.
frozen_set: v2
calibration:
  - model: claude-opus-5
    draws: 5
    passed: 1
    date: 2026-08-09
  - model: claude-haiku-4-5
    draws: 5
    passed: 3
    date: 2026-08-09
